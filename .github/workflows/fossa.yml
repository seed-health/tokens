name: FOSSA

on:
  # Scan main when dependencies change to keep FOSSA's compliance inventory current.
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fossa:
    name: License & dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Gives FOSSA the fully resolved dependency tree.
      - name: Install dependencies
        run: npm ci

      # Uploads the dependency/license graph to FOSSA (`fossa analyze`).
      - name: FOSSA analyze
        uses: fossas/fossa-action@v2
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
